<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMERGENCE — Sociedade Artificial</title>
    <meta name="description" content="Uma sociedade artificial de agentes autônomos para observar, perturbar e investigar." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230c0f14'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%235fd0a5'/%3E%3Ccircle cx='20' cy='11' r='3' fill='%23e8b04a'/%3E%3Ccircle cx='17' cy='21' r='3' fill='%2379a7ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">Emergence</span>
          <span class="tag" id="seedtag">sociedade artificial</span>
        </div>
        <div class="clock">
          <span id="date">—</span>
          <span id="climate" class="pill">clima normal</span>
          <span id="popcount" class="pill">—</span>
        </div>
        <div class="controls">
          <div class="seg" id="viewmode" title="Alternar visão 3D / mapa (tecla V)">
            <button data-mode="3d" class="on"><i data-icon="cube" data-size="14"></i>3D</button>
            <button data-mode="2d"><i data-icon="map" data-size="14"></i>Mapa</button>
          </div>
          <button id="play" class="btn icon" title="Pausar / continuar (Espaço)"><i data-icon="pause" data-size="15"></i></button>
          <div class="seg" id="speeds">
            <button data-speed="1" class="on" title="Tecla 1">1×</button>
            <button data-speed="3" title="Tecla 2">3×</button>
            <button data-speed="10" title="Tecla 3">10×</button>
            <button data-speed="30" title="Tecla 4">30×</button>
          </div>
          <button id="btn-new" class="btn" title="Configurar e gerar um novo mundo">Novo mundo</button>
          <button id="btn-replay" class="btn" title="Recomeçar exatamente o mesmo mundo (mesma semente)"><i data-icon="replay" data-size="14"></i>Mesma semente</button>
          <button id="btn-lab" class="btn accent" title="Rodar experimentos controlados"><i data-icon="lab" data-size="15"></i>Laboratório</button>
          <button id="btn-help" class="btn icon" title="Como funciona"><i data-icon="help" data-size="16"></i></button>
        </div>
      </header>

      <div id="stage">
        <div id="viewport">
          <canvas id="world"></canvas>
          <canvas id="world3d"></canvas>
          <div id="label3d"></div>
        </div>

        <nav id="toolbar" aria-label="Ferramentas de intervenção">
          <div class="tgroup">
            <button class="tool on" data-tool="observe" title="Observar: clique em um indivíduo para inspecioná-lo. Arraste para mover a câmera; botão direito gira (3D)."><i data-icon="observe"></i><span>Observar</span></button>
          </div>
          <div class="tlabel">Ambiente</div>
          <div class="tgroup">
            <button class="tool" data-tool="plant" title="Plantar arbustos de frutas (pincel)"><i data-icon="plant"></i><span>Plantar</span></button>
            <button class="tool" data-tool="gift" title="Lançar uma dádiva de comida no chão"><i data-icon="gift"></i><span>Dádiva</span></button>
            <button class="tool" data-tool="clear" title="Remover vegetação (pincel)"><i data-icon="clear"></i><span>Desmatar</span></button>
            <button class="tool" data-tool="forest" title="Plantar floresta (pincel)"><i data-icon="forest"></i><span>Floresta</span></button>
            <button class="tool" data-tool="water" title="Criar lago (pincel)"><i data-icon="water"></i><span>Água</span></button>
            <button class="tool" data-tool="fire" title="Iniciar um incêndio"><i data-icon="fire"></i><span>Fogo</span></button>
          </div>
          <div class="tlabel">Indivíduos</div>
          <div class="tgroup">
            <button class="tool" data-tool="spawn" title="Introduzir um novo indivíduo"><i data-icon="spawn"></i><span>Novo ser</span></button>
            <button class="tool" data-tool="disease" title="Infectar um indivíduo com uma doença contagiosa"><i data-icon="disease"></i><span>Doença</span></button>
            <select id="preset" title="Personalidade do novo indivíduo"></select>
          </div>
          <div class="tlabel">Clima</div>
          <div class="tgroup">
            <button class="tool act" id="cl-drought" title="Seca severa por 16 dias: chuva cai, lagos rasos secam, plantas crescem pouco"><i data-icon="drought"></i><span>Seca</span></button>
            <button class="tool act" id="cl-deluge" title="Chuvas abundantes por 12 dias"><i data-icon="deluge"></i><span>Chuvas</span></button>
            <button class="tool act" id="cl-winter" title="Invernos rigorosos (frio mais intenso, mais lenha queimada)"><i data-icon="winter"></i><span>Inverno duro</span></button>
            <button class="tool act" id="cl-normal" title="Normalizar o clima"><i data-icon="normal"></i><span>Normal</span></button>
          </div>
          <div class="brush">
            <label>Pincel <input id="brush" type="range" min="1" max="6" value="2" /></label>
          </div>
        </nav>

        <div id="hint"></div>
        <div id="tooltip"></div>

        <div id="legend">
          <div><i class="dot" style="background:#4fd1b5"></i>generoso <i class="dot" style="background:#e8794a"></i>egoísta/ousado</div>
          <div><i class="ring"></i>anel = grupo emergente · casa = abrigo</div>
          <label class="chk"><input type="checkbox" id="ov-net" /> rede de confiança</label>
          <label class="chk"><input type="checkbox" id="ov-glyph" checked /> intenções</label>
        </div>
      </div>

      <aside id="side">
        <div class="tabs">
          <button data-tab="agent" class="on">Indivíduo</button>
          <button data-tab="society">Sociedade</button>
        </div>
        <div id="panel-agent" class="panel"></div>
        <div id="panel-society" class="panel hidden"></div>
      </aside>

      <section id="bottom">
        <div id="charts"></div>
        <div id="feed">
          <div class="feedhead">
            <strong>Crônica</strong>
            <div class="seg small" id="feedfilter">
              <button data-f="all" class="on">tudo</button>
              <button data-f="social">social</button>
              <button data-f="conflict">conflito</button>
              <button data-f="life">vida</button>
              <button data-f="world">mundo</button>
            </div>
          </div>
          <ul id="events"></ul>
        </div>
      </section>
    </div>

    <div id="intro" class="hidden" role="dialog" aria-modal="true" aria-labelledby="intro-title"></div>
    <div id="modal" class="hidden"><div class="box" id="modalbox"></div></div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
