  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">EMERGENCE</span>
          <span class="tag">experimento de sociedade artificial</span>
        </div>
        <div class="clock">
          <span id="date">—</span>
          <span id="climate" class="pill">clima normal</span>
          <span id="popcount" class="pill">—</span>
        </div>
        <div class="controls">
          <button id="play" class="btn icon" title="Pausar / continuar (Espaço)">⏸</button>
          <div class="seg" id="speeds">
            <button data-speed="1" class="on" title="Tecla 1">1×</button>
            <button data-speed="3" title="Tecla 2">3×</button>
            <button data-speed="10" title="Tecla 3">10×</button>
            <button data-speed="30" title="Tecla 4">30×</button>
          </div>
          <button id="btn-new" class="btn" title="Configurar e gerar um novo mundo">Novo mundo</button>
          <button id="btn-replay" class="btn" title="Recomeçar exatamente o mesmo mundo (mesma semente)">↺ Mesma semente</button>
          <button id="btn-lab" class="btn accent" title="Rodar experimentos controlados">Laboratório</button>
          <button id="btn-help" class="btn icon" title="Como funciona">?</button>
        </div>
      </header>

      <div id="stage">
        <canvas id="world"></canvas>

        <nav id="toolbar" aria-label="Ferramentas de intervenção">
          <div class="tgroup">
            <button class="tool on" data-tool="observe" title="Observar: clique em um indivíduo para inspecioná-lo. Arraste para mover a câmera.">🔍<span>Observar</span></button>
          </div>
          <div class="tlabel">Ambiente</div>
          <div class="tgroup">
            <button class="tool" data-tool="plant" title="Plantar arbustos de frutas (pincel)">🌱<span>Plantar</span></button>
            <button class="tool" data-tool="gift" title="Lançar uma dádiva de comida no chão">🧺<span>Dádiva</span></button>
            <button class="tool" data-tool="clear" title="Remover vegetação (pincel)">🪓<span>Desmatar</span></button>
            <button class="tool" data-tool="forest" title="Plantar floresta (pincel)">🌲<span>Floresta</span></button>
            <button class="tool" data-tool="water" title="Criar lago (pincel)">💧<span>Água</span></button>
            <button class="tool" data-tool="fire" title="Iniciar um incêndio">🔥<span>Fogo</span></button>
          </div>
          <div class="tlabel">Indivíduos</div>
          <div class="tgroup">
            <button class="tool" data-tool="spawn" title="Introduzir um novo indivíduo">👤<span>Novo ser</span></button>
            <select id="preset" title="Personalidade do novo indivíduo"></select>
            <button class="tool" data-tool="disease" title="Infectar um indivíduo com uma doença contagiosa">🦠<span>Doença</span></button>
          </div>
          <div class="tlabel">Clima</div>
          <div class="tgroup">
            <button class="tool act" id="cl-drought" title="Seca severa por 16 dias: chuva cai, lagos rasos secam, plantas crescem pouco">☀️<span>Seca</span></button>
            <button class="tool act" id="cl-deluge" title="Chuvas abundantes por 12 dias">🌧️<span>Chuvas</span></button>
            <button class="tool act" id="cl-winter" title="Invernos rigorosos (frio mais intenso, mais lenha queimada)">❄️<span>Inverno rigoroso</span></button>
            <button class="tool act" id="cl-normal" title="Normalizar o clima">⛅<span>Normal</span></button>
          </div>
          <div class="brush">
            <label>Pincel <input id="brush" type="range" min="1" max="6" value="2" /></label>
          </div>
        </nav>

        <div id="hint"></div>
        <div id="tooltip"></div>

        <div id="legend">
          <div><i class="dot" style="background:#4fd1b5"></i>generoso <i class="dot" style="background:#e8794a"></i>egoísta/ousado</div>
          <div><i class="ring"></i>anel = grupo emergente · 🏠 abrigo</div>
          <label class="chk"><input type="checkbox" id="ov-net" /> rede de confiança</label>
          <label class="chk"><input type="checkbox" id="ov-glyph" checked /> intenções</label>
        </div>
      </div>

      <aside id="side">
        <div class="tabs">
          <button data-tab="agent" class="on">Indivíduo</button>
          <button data-tab="society">Sociedade</button>
        </div>
        <div id="panel-agent" class="panel"></div>
        <div id="panel-society" class="panel hidden"></div>
      </aside>

      <section id="bottom">
        <div id="charts"></div>
        <div id="feed">
          <div class="feedhead">
            <strong>Crônica</strong>
            <div class="seg small" id="feedfilter">
              <button data-f="all" class="on">tudo</button>
              <button data-f="social">social</button>
              <button data-f="conflict">conflito</button>
              <button data-f="life">vida</button>
              <button data-f="world">mundo</button>
            </div>
          </div>
          <ul id="events"></ul>
        </div>
      </section>
    </div>

    <div id="modal" class="hidden"><div class="box" id="modalbox"></div></div>

  </body>
</html>
